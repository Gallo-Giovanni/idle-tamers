<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Frontiera Arcana v0.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E24;--panel:#161A3A;--line:#2A3066;--txt:#EEF0FF;--muted:#A9B0D6;--gold:#F2C14E;--cyan:#7FE3F0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit}
#app{max-width:480px;margin:0 auto;position:fixed;top:0;bottom:0;left:0;right:0;height:auto;display:flex;flex-direction:column;overflow:hidden}
header{padding:6px 10px 5px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.title{font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:700}
#where{font-size:10.5px;color:var(--muted)}
.res{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:11.5px;font-weight:600}
.pbar{height:3px;background:#1E2350;border-radius:3px;overflow:hidden}.pbar b{display:block;height:100%;background:var(--gold);transition:width .3s}
#testbadge{font-size:10px;font-weight:700;color:#0B0E24;background:var(--gold);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
#scene{position:relative;height:118px;background-size:480px 150px;animation:scrollsky 90s linear infinite paused;flex-shrink:0;overflow:hidden;background-color:#141A4A;background-image:radial-gradient(1.5px 1.5px at 30px 30px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90px 80px,#cfd6ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 160px 20px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 220px 60px,#cfd6ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 300px 40px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 350px 90px,#cfd6ff 50%,transparent 51%),radial-gradient(1px 1px at 420px 30px,#fff 50%,transparent 51%)}
@keyframes drift{to{transform:translateX(-30px)}}
.planet{animation:drift 90s linear infinite alternate;position:absolute;right:26px;top:8px;width:28px;height:28px;border-radius:50%;background:#3B3F8F;box-shadow:inset -8px -6px 0 #2A2D6E}
.ring{position:absolute;right:16px;top:19px;width:48px;height:7px;border:2px solid #8C7BE0;border-radius:50%;transform:rotate(-14deg)}
.ground{position:absolute;left:0;right:0;bottom:0;height:28px;background-color:#2B3570;background-image:repeating-linear-gradient(90deg,#2B3570 0 36px,#26306A 36px 48px,#2B3570 48px 80px),radial-gradient(2px 2px at 20px 12px,#6B7BD1 50%,transparent 51%);background-size:80px 28px,80px 28px;border-top:4px solid #6B7BD1;animation:scrollground 1.4s linear infinite paused}
#scene.march,#scene.march .ground,#scene.march .hills{animation-play-state:running}
.hills{position:absolute;left:0;right:0;bottom:24px;height:40px;background-image:radial-gradient(60px 34px at 40px 40px,#232A62 98%,transparent 100%),radial-gradient(90px 44px at 170px 44px,#1E2458 98%,transparent 100%),radial-gradient(50px 26px at 300px 40px,#232A62 98%,transparent 100%);background-size:400px 40px;background-repeat:repeat-x;animation:scrollhills 9s linear infinite paused}
@keyframes scrollhills{to{background-position:-400px 0}}
#scene.march #units .u:not(.walk) .spr{animation:step .3s steps(2) infinite}
@keyframes step{50%{transform:translateY(-2px)}}
#units .u .hpb{width:20px;height:3px}
@keyframes scrollground{to{background-position:-80px 0,-80px 0}}
@keyframes scrollsky{to{background-position:-480px 0}}
.u.walk .spr{animation:walk .35s steps(2) infinite}@keyframes walk{50%{transform:scaleX(-1) translateY(-2px)}}
.lr.far{opacity:.55}.lr.far .lh{color:var(--muted);font-style:italic}
#units{position:absolute;inset:0;left:50%;width:390px;margin-left:-195px}
.u{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;transition:opacity .3s,filter .3s}
.u.dead{opacity:.25;filter:grayscale(1)}
.u.lg{animation:lg .18s ease-out}
@keyframes lg{50%{transform:translateX(var(--dx))}}
.hpb{width:34px;height:4px;background:#05060F;border:1px solid #000}.hpb b{display:block;height:100%}
.mk{position:absolute;top:-16px;display:none}.u.marked .mk{display:block}
.spr{position:relative;flex-shrink:0}.spr i{position:absolute;display:block}

.fl.crit{color:var(--gold);font-size:16px}.fl.hurt{color:#FF8A96;font-size:11px}.fl.skill{color:#D8C2FF;font-size:12px}

#banner{z-index:5;position:absolute;left:0;right:0;top:8px;text-align:center;font-family:'Pixelify Sans',sans-serif;font-size:17px;font-weight:700;color:#fff;text-shadow:2px 2px 0 #000;opacity:0;pointer-events:none}
#banner.show{animation:bn 1.6s ease-out}

#log{flex-shrink:0;max-height:118px;overflow-y:auto;background:#0E1230;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 10px 4px;font-size:10.5px}

.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;row-gap:3px}
.pc{min-width:0}.pt{display:flex;align-items:center;gap:4px;font-size:10.5px;line-height:13px}
.pt i{width:6px;height:6px;border-radius:2px;flex-shrink:0}.pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}

.hbar{height:2px;background:#1E2350;border-radius:2px;overflow:hidden;margin-top:1px}.hbar b{display:block;height:100%;transition:width .2s}
.pc.ko{opacity:.4}.pc.ko .pd{color:#FF8A96}.pc.mvp .pd{color:#FFD97A}
#panel{flex:1;overflow-y:auto;padding:2px 10px 12px;min-height:0;font-size:13px}

.toast{background:rgba(22,26,58,.96);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:8px;padding:8px 10px;font-size:12.5px;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
nav{display:flex;gap:2px;padding:3px 6px calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0E1230;flex-shrink:0}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:44px;padding:4px 0;background:none;border:none;border-radius:8px;color:var(--muted);font-size:9px;font-weight:600;cursor:pointer}
.tab[aria-current=page]{color:var(--gold);background:#1E2350}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 5px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-family:'Pixelify Sans',sans-serif;font-size:15px;color:var(--gold)}.ph span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:5px}
.note{font-size:11px;color:var(--muted);margin:3px 0 6px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:4px;font-size:11px}.chip i{width:8px;height:8px;border-radius:2px}.chip em{color:var(--gold);font-style:normal;font-weight:700}
.mrow{display:flex;align-items:center;gap:4px;padding:3px 6px}

.mbtns{display:flex;gap:4px}

.sb,.pb,.discord{min-height:36px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#1E2350;color:var(--txt)}
.pb{background:var(--gold);color:#1B1430;border:none;font-weight:700}

.row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0}

.rename,.wform{display:flex;gap:8px;align-items:center;margin-top:8px}.rename label,.wform label{font-size:12px;color:var(--muted)}
.rename input,.wform input{flex:1;min-width:0;min-height:40px;background:#10143A;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:0 10px;font-size:14px}

.row2 label{font-size:12px;color:var(--muted);flex:0 0 auto}
.free{font-size:12px;color:var(--muted);border-style:dashed}

.igrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.it{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;background:#10143A;border:2px solid;border-radius:6px;padding:4px 2px;color:var(--txt);cursor:pointer;min-height:48px}

.it i{position:absolute;top:-7px;right:-4px;font-size:8.5px;font-style:normal;background:var(--gold);color:#1B1430;border-radius:4px;padding:0 3px;font-weight:700}
.it.sel{outline:2px solid #fff;outline-offset:1px}
.iname{font-weight:700;font-size:15px}
.idet{border-width:2px}
.bar{height:6px;background:#1E2350;border-radius:3px;overflow:hidden}.bar b{display:block;height:100%;background:var(--cyan)}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.best{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;margin:0}
.bspr{height:40px;display:flex;align-items:flex-end}.best b{font-size:12px}.best span{font-size:10.5px}.best em{font-size:11px;color:var(--gold);font-style:normal}.best small{font-size:10.5px;color:var(--muted)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px}.trow .sb{flex:0 0 auto}
.lvl{font-size:12px;color:var(--muted)}
.pips{display:flex;gap:3px;margin-top:6px}.pips i{width:10px;height:10px;border-radius:50%;border:1px solid #3A4180}.pips i.on{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.sgrid div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}.sgrid span{display:block;font-size:10px;color:var(--muted)}.sgrid b{font-size:14px}
canvas{width:100%;height:auto;display:block;margin-top:6px}
.arow{display:flex;gap:10px;align-items:center;opacity:.6}.arow.done{opacity:1;border-color:#3B6E45}
#modal{position:absolute;inset:0;top:var(--sb,0px);background:rgba(5,6,18,.86);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.mod{width:100%;max-width:400px;max-height:100%;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px}
.mod h2{font-family:'Pixelify Sans',sans-serif;font-size:28px;margin:6px 0;text-align:center}
.cap{text-align:center}
.kick{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--gold)}
.halo{height:150px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(160,107,230,.45) 0%,rgba(160,107,230,.1) 50%,transparent 70%)}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.badges{display:flex;gap:8px;justify-content:center}.rb{font-size:12px;font-weight:700;color:var(--gold);border:1.5px solid var(--gold);border-radius:999px;padding:3px 10px}.cb{font-size:12px;font-weight:700;color:#0B0E24;border-radius:999px;padding:4px 10px}
.quote{font-style:italic;color:#D5DAF5;font-size:14px;line-height:1.45}

.cap .rename{text-align:left}
.slotbox{display:flex;flex-direction:column;gap:4px}
.slup{min-height:30px;border-radius:8px;border:1px solid #2C5C70;background:#10243A;color:#BFF3FA;font-size:11px;font-weight:600;cursor:pointer}.slup:disabled{opacity:.4;cursor:default}
.slv{color:#5BD8E6;font-size:11px}
.stbox{background:#0C0F2A;border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin:6px 0;font-size:11.5px}
.srow2{display:flex;justify-content:space-between;padding:1px 0}.srow2 span{color:var(--muted);display:flex;align-items:center;gap:5px}.srow2 b{font-variant-numeric:tabular-nums}

/* Effetti sugli oggetti dal Leggendario in su: crescono con la rarità */
.fx{position:relative;overflow:hidden}
.fx::before,.fx::after{content:'';position:absolute;pointer-events:none}
/* Leggendario: alone che respira */
.fx-leggendaria{animation:fxbreath 2.4s ease-in-out infinite}
@keyframes fxbreath{50%{box-shadow:0 0 10px 1px var(--c)}}
/* Mitico: alone + riflesso dorato che passa */
.fx-mitico{animation:fxbreath 2.2s ease-in-out infinite}
.fx-mitico::before{inset:-40% auto -40% -60%;width:40%;background:linear-gradient(100deg,transparent,#fff7c8aa,transparent);transform:skewX(-20deg);animation:fxsweep 2.6s ease-in-out infinite}
@keyframes fxsweep{0%{left:-60%}55%,100%{left:130%}}
/* Astrale: riflesso + scintille rosa */
.fx-astrale{animation:fxbreath 2s ease-in-out infinite}
.fx-astrale::before{inset:-40% auto -40% -60%;width:40%;background:linear-gradient(100deg,transparent,#ffe0f6aa,transparent);transform:skewX(-20deg);animation:fxsweep 2.4s ease-in-out infinite}
.fx-astrale::after,.fx-arcano::after,.fx-eterno::after,.fx-segreto::after{inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 25%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 65% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 30% 75%,#fff 50%,transparent 51%);animation:fxtw 1.6s ease-in-out infinite}
@keyframes fxtw{0%,100%{opacity:.15}50%{opacity:1}}
/* Arcano: aura pulsante rossa + scintille */
.fx-arcano{animation:fxfire 1.4s ease-in-out infinite}
@keyframes fxfire{0%,100%{box-shadow:0 0 6px 0 var(--c),inset 0 -8px 12px -6px var(--c)}50%{box-shadow:0 0 14px 2px var(--c),inset 0 -14px 16px -6px var(--c)}}
/* Eterno e Segreto: luce che gira lungo il bordo */
@property --fa{syntax:'<angle>';inherits:false;initial-value:0deg}
.fx-eterno,.fx-segreto{border-color:transparent!important;animation:fxrot 2.4s linear infinite,fxbreath 2s ease-in-out infinite}
.fx-eterno{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 30%,transparent),transparent 62%) padding-box,linear-gradient(#10143A,#10143A) padding-box,conic-gradient(from var(--fa),color-mix(in srgb,var(--c) 35%,transparent) 0 55%,var(--c) 80%,#fff 88%,color-mix(in srgb,var(--c) 35%,transparent) 100%) border-box!important}
.fx-segreto{animation:fxrot 2s linear infinite,fxhue 3s linear infinite;background:radial-gradient(circle at 50% 35%,#ffffff33,transparent 62%) padding-box,linear-gradient(#10143A,#10143A) padding-box,conic-gradient(from var(--fa),#ff5f6d,#ffc371,#7CFFB2,#7FE3FF,#B07CF0,#ff5f6d) border-box!important}
@keyframes fxrot{to{--fa:360deg}}
@keyframes fxhue{0%{box-shadow:0 0 12px 2px #ff5f6d}33%{box-shadow:0 0 12px 2px #7CFFB2}66%{box-shadow:0 0 12px 2px #B07CF0}100%{box-shadow:0 0 12px 2px #ff5f6d}}
.fx>*{position:relative;z-index:1}
.fx-eterno.it,.fx-segreto.it{background-color:#10143A}

// ---------------- Battaglia ----------------
// Curva a tre tratti: le prime battaglie volano, poi la difficoltà accelera (prima parte facile, muro verso il boss)
// Ogni zona: prime battaglie facili, poi accelera verso il boss. Ogni zona nuova parte un po' sotto il boss della precedente.
// Dentro una zona i nemici crescono poco (gli oggetti hanno il livello della zona): il salto vero è tra una zona e l'altra
let WZ = 1.03; if (typeof process !== 'undefined' && process.env && process.env.WZ) WZ = +process.env.WZ;

let WZ2 = 1.056; if (typeof process !== 'undefined' && process.env && process.env.WZ2) WZ2 = +process.env.WZ2;

// Passo tra le zone: sul primo pianeta più dolce, sul secondo più ripido (la squadra è già grande)
let ZONE_K = [0, 0, 1.3, 1.3, 1.3, 1.3, 1.45, 1.45, 1.45, 1.45, 1.45, 1.85, 1.85, 1.85, 1.85, 1.85, 1.65, 1.65, 1.65, 1.65, 1.65]; // tarato: zone 1-5 nel primo giorno, zona 10 in circa 3 giorni, zona 20 in circa 34 giorni (giocatore che controlla ogni 4 ore)

function enemyScale(z, n) { return ZONE_BASE[z] * withinZone(n, z); }

const MELEE_STEP = 2; // velocità con cui la mischia raggiunge chi sta dietro (unità di gittata al secondo)

const ENEMY_START = 14, ENEMY_SPACING = 4, ENEMY_GAP = 0.5, ENEMY_V = { Guerriero: 6, Arciere: 4.5, Mago: 4.5, Curatore: 4 };

}

// La vita NON si ricarica tra una battaglia e l'altra: solo i Curatori curano.
// Si torna a vita piena quando cambia la zona, quando la zona ricomincia dopo il boss o quando la squadra cade.
function startBattle(s) {

function alive(list) { return list.filter(u => u.hp > 0); }
function ready(list) { return list.filter(u => u.hp > 0 && !(u.arrive > 0)); }
function frontTarget(s, list) {

  let best = a[0]; for (const u of a) { const g = CLASSES[u.cls].range, gb = CLASSES[best.cls].range; if (g < gb || (g === gb && u.idx < best.idx)) best = u; } return best;
}

function dealDamage(s, b, src, dst, mult, ignoreDef, ev) {

function attack(s, b, u, ev) {
  const foes = u.side === 'p' ? b.enemies : b.party;

  if (!tgt) return;

  if (u.side === 'p' && u.cls === 'Guerriero' && u.hits % 3 === 0) {
    if (ev) ev.push({ type: 'skill', side: 'p', idx: u.idx, name: 'Fendente!' });
    dealDamage(s, b, u, tgt, 2.2, false, ev);

  }
  if (u.side === 'p' && u.cls === 'Arciere' && u.hits % 3 === 0) {

}

// Chi cade in battaglia torna a vita piena dopo 2 minuti di gioco
const RESPAWN_TIME = 120;
function step(s, b, dt, ev) {

function finishBattle(s, b, ev) {

function onKill(s, b, e, ev) {

function tryCapture(s, e, ev) {

    const m = newMember(sp, 1); m.waitKills = 1; s.roster[sp] = m; if (!teamFull(s)) s.team.push(sp);

  }

  if (tutorial || rnd(s) < p) { // nessuna cattura garantita: solo fortuna (tranne la prima del tutorial)
    const m = newMember(sp, 1); m.waitKills = s.hunt[sp]; s.roster[sp] = m; // chi si unisce parte dal livello 1

}
function avgLevel(s) { let t = 0; for (const id of s.team) t += s.roster[id].lvl; return t / s.team.length; }

function gainXp(s, id, xp, ev) {
  const m = s.roster[id]; if (m.lvl >= LEVEL_CAP) { m.xp = 0; return; } m.xp += xp;
  while (m.lvl < LEVEL_CAP && m.xp >= xpNeed(m.lvl)) { m.xp -= xpNeed(m.lvl); m.lvl++; if (ev) ev.push({ type: 'level', id, lvl: m.lvl }); }
}

function dropItem(s, boss, ev) {
  const r = pickWeighted(s, ITEM_RARITY, x => x.weight); // stesse probabilità in ogni zona e per ogni nemico
  const slot = KINDS[Math.floor(rnd(s) * KINDS.length)];
  const cls = slot === 'arma' || slot === 'secondaria' ? Object.keys(CLASSES)[Math.floor(rnd(s) * 4)] : null;
  const it = finishItem(s, { id: s.nextId++, slot, cls, rarity: r.key, lvl: rollItemLevel(s, s.zone), up: 0, isNew: true });
  s.stats.items++; s.stats.byRar = s.stats.byRar || {}; s.stats.byRar[r.key] = (s.stats.byRar[r.key] || 0) + 1;

  if (rarityIndex(r.key) < minKeep(s)) { s.gold += sellValue(it, s); s.stats.autoSold = (s.stats.autoSold || 0) + 1; return; }

    s.stats.lost = (s.stats.lost || 0) + 1; if (ev) ev.push({ type: 'lost', item: it }); return;
  }

// Equipaggia tutto: dal più forte, al primo membro (in ordine di squadra) che può usarlo e migliora
function autoEquip(s, withReserve) {
  if (withReserve === undefined) withReserve = !!(s.settings && s.settings.eqReserve);
  const who = withReserve ? s.team.concat(Object.keys(s.roster).filter(id => !s.team.includes(id))) : s.team;
  let changed = 0, guard = 0;
  let again = true;
  while (again && guard++ < 200) {
    again = false;
    const inv = s.inventory.slice().sort((a, b) => itemPower(b) - itemPower(a));
    for (const it of inv) {
      for (const id of who) {
        const m = s.roster[id]; if (m.locked || !canUse(m, it)) continue;
        const sl = targetSlot(m, it), cur = m.eq[sl];
        if (!cur || itemPower(it) > itemPower(cur)) {

          if (cur) s.inventory.push(cur);
          m.eq[sl] = it; it.isNew = false; changed++; again = true; break;

}
// Pass Astrale (abbonamento mensile). Nella versione di prova si attiva gratis per 30 giorni.

function activatePass(s) { s.pass = Math.max(Date.now(), s.pass || 0) + 30 * 86400000; }

// Gratis si vendono da soli solo i comuni (al massimo "tieni da Non comune in su"); oltre serve il Pass
const FREE_MAX_FILTER = 1; // gratis: si vendono solo i comuni
// Zaino e forziere: 20 posti ciascuno, il doppio col Pass. Le rune non occupano posto.

function passSaved(r) {
  if (F.hasPass(S) || !r.lost || !r.byRar) return 0;
  const idx = k => F.ITEM_RARITY.findIndex(x => x.key === k), keep = F.minKeep(S);
  const cand = th => Object.keys(r.byRar).reduce((t, k) => t + (idx(k) >= th ? r.byRar[k] : 0), 0);
  const used = cand(keep) - r.lost, lostPass = Math.max(0, cand(Math.max(keep, F.PASS_MAX_FILTER)) - (used + 20));
  return Math.max(0, r.lost - lostPass);
}

function skipTime(hours) {
  const total = hours * 3600, chunk = 6 * 3600;
  let done = 0; const sum = { byRar: {}, skip: true, seconds: 0, gold: 0, kills: 0, items: 0, lost: 0, runes: { noncomune: 0, rara: 0, epica: 0, leggendaria: 0, mitico: 0, astrale: 0, arcano: 0 }, levels: {}, events: [] };
  $('#modal').innerHTML = `<div class="mod" role="dialog" aria-modal="true"><h2>Avanti veloce</h2><p class="msub" id="skipst">Simulazione in corso…</p><div class="bar"><b id="skipbar" style="width:0%"></b></div></div>`;
  $('#modal').hidden = false;
  const run = () => {
    const sec = Math.min(chunk, total - done);
    const r = F.simulateOffline(S, sec, true);
    sum.seconds += r.seconds; sum.gold += r.gold; sum.kills += r.kills; sum.items += r.items; sum.lost += r.lost || 0; for (const k in (r.byRar || {})) sum.byRar[k] = (sum.byRar[k] || 0) + r.byRar[k];
    for (const k in r.runes) sum.runes[k] += r.runes[k];
    for (const l of r.levels) { if (!sum.levels[l.id]) sum.levels[l.id] = { id: l.id, from: l.from, to: l.to }; else sum.levels[l.id].to = l.to; }
    sum.events.push(...r.events);
    done += sec;
    $('#skipbar').style.width = (100 * done / total) + '%'; $('#skipst').textContent = `Simulazione in corso… ${Math.round(done / 3600)} h su ${hours} h`;
    if (done < total) setTimeout(run, 0);
    else {
      if (hours >= 8) F.ensureShop(S, Date.now(), true);
      F.checkAch(S); save(); B = F.startBattle(S); buildScene();
      sum.levels = Object.values(sum.levels); closeModal(); showOffline(sum); dirty = true;
    }
  };
  setTimeout(run, 30);
}

function chatShow() { chatOpen = true; $('#chatbtn').classList.remove('dot'); chatRender(true); chatLoad(); clearInterval(chatTimer); chatTimer = setInterval(chatLoad, 6000); }
function chatClose() { chatOpen = false; clearInterval(chatTimer); $('#modal').classList.remove('chatfull'); closeModal(); }
// invia al server i drop rari non ancora condivisi (anche quelli trovati offline)
async function shareDrops() {
  if (!S.net || !S.rareLog) return;
  for (const e of S.rareLog.filter(x => !x.sent).reverse().slice(0, 5)) {
    try { await api('rpc/it_post_drop', { p_token: S.net.token, p_rarity: e.rarity, p_slot: e.slot, p_zone: e.zone, p_ilvl: e.lvl || 1 }); e.sent = true; } catch (err) { e.sent = true; }
  }
}
// classifica: potenza totale di tutti i personaggi
function totalPower() { let p = 0; for (const id in S.roster) p += F.memberPower(S, id); return Math.round(p); }
let lastScore = 0;
async function shareScore() { if (!S.net || Date.now() - lastScore < 60000) return; lastScore = Date.now(); try { await api('rpc/it_post_score', { p_token: S.net.token, p_power: totalPower(), p_zone: S.cleared, p_creatures: F.capturedCount(S) }); } catch (e) {} }
// pallino sul pulsante se ci sono messaggi nuovi
async function chatPeek() {
  if (chatOpen) return;
  try { // pallino se ci sono messaggi di altri più recenti dell'ultimo letto (anche appena entri nel gioco)
    const seen = +(localStorage.getItem('it_seen') || 0);
    const r = await api(`it_chat?select=id,player_id&id=gt.${seen}&order=id.desc&limit=20`);
    if ((r || []).some(m => !S.net || m.player_id !== S.net.id)) $('#chatbtn').classList.add('dot');
  } catch (e) {}
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-chat]'); if (!t) return;
  const a = t.dataset.chat;
  if (a === 'open') chatShow();
  else if (a === 'close') chatClose();
  else if (a === 'tab') { chatTab = t.dataset.v; chatRender(); chatLoad(); }
  else if (a === 'report') { try { await api('rpc/it_report', { p_token: S.net.token, p_chat_id: +t.dataset.id }); toast('Segnalazione inviata, grazie'); } catch (err) { toast('Segnalazione non riuscita'); } }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'welcomeform') {
    e.preventDefault(); const v = $('#wnick').value.trim(), msg = t => { const w = $('#wmsg'); if (w) w.textContent = t; };
    if (v.length < 3) { msg('Il nickname deve avere almeno 3 caratteri.'); return; }
    if (BAD.some(w => v.toLowerCase().includes(w))) { msg('Scegli un nickname senza parolacce.'); return; }
    msg(''); const btn = e.target.querySelector('button'); btn.disabled = true;
    const res = await registerNick(v); btn.disabled = false;
    if (res === 'taken') { msg('Il nickname «' + v + '» è già occupato: scegline un altro.'); return; }
    if (res === 'check') { msg('Usa solo lettere, numeri, spazi, _ . -'); return; }
    if (res === 'net') { msg('Connessione assente: serve internet per registrare il nickname. Riprova.'); return; }
    S.nick = v; save();
    if (!S.tutorial) showTutorial(0); else closeModal();
    return;
  }
  if (e.target.id === 'nickform') {
    e.preventDefault(); const v = $('#nickin').value.trim();
    if (v.length < 3) { toast('Il nickname deve avere almeno 3 caratteri'); return; }
    if (BAD.some(w => v.toLowerCase().includes(w))) { toast('Scegli un nickname senza parolacce'); return; }
    try { const r = await api('rpc/it_register', { p_nickname: v }); S.net = { id: r.id, token: r.token, nick: r.nickname }; save(); toast('Benvenuto in chat, ' + esc(r.nickname) + '!', '#7FE3FF'); shareDrops(); chatRender(); }
    catch (err) { toast(/taken/.test(err.message) ? 'Nickname già usato, scegline un altro' : /check/.test(err.message) ? 'Usa solo lettere, numeri, spazi, _ . -' : 'Registrazione non riuscita'); }
  } else if (e.target.id === 'chatform') {
    e.preventDefault(); const inp = $('#chatin'), v = inp.value.trim(); if (!v) return;
    const tmp = { id: -Date.now(), player_id: S.net.id, nickname: S.net.nick, body: v, created_at: new Date().toISOString() }; chatMsgs.push(tmp); inp.value = ''; chatRender(); const l0 = $('#chatlist'); if (l0) l0.scrollTop = l0.scrollHeight; inp.focus();
    try { await api('rpc/it_post_message', { p_token: S.net.token, p_body: v }); await chatLoad(); const l = $('#chatlist'); if (l) l.scrollTop = l.scrollHeight; }
    catch (err) { chatMsgs = chatMsgs.filter(m => m !== tmp); chatRender(); inp.value = v; toast(/too_fast/.test(err.message) ? 'Piano! Aspetta qualche secondo' : 'Messaggio non inviato'); }
  }
});
setInterval(shareDrops, 60000); setInterval(chatPeek, 20000); setInterval(shareScore, 600000); setTimeout(() => { shareDrops(); chatPeek(); }, 3000);

// ---------- input ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab]');
  if (!t) { if (!e.target.closest('.pop') && (selItem || selRune || selShop !== null) && e.target.closest('#panel')) { selItem = null; selRune = null; selShop = null; render(); } return; }
  if (t.dataset.tab) { tab = t.dataset.tab; selItem = null; selRune = null; selShop = null; render(); $('#panel').scrollTop = 0; return; }
  const a = t.dataset.act, id = t.dataset.id, item = +t.dataset.item;
  const rebuild = () => { B = F.startBattle(S); buildScene(); };
  if (a === 'openm') openMember = openMember === id ? null : id;
  else if (a === 'up') F.moveMember(S, id, -1);
  else if (a === 'down') F.moveMember(S, id, 1);
  else if (a === 'add') { F.addToTeam(S, id); rebuild(); }
  else if (a === 'bench') { F.removeFromTeam(S, id); openMember = null; rebuild(); }
  else if (a === 'uneq') F.unequip(S, id, t.dataset.slot);
  else if (a === 'selit') { selItem = selItem === item ? null : item; selRune = null; }
  else if (a === 'lockit') { const on = F.toggleLock(S, item); toast(on ? 'Oggetto bloccato: non verrà mai venduto' : 'Oggetto sbloccato'); }
  else if (a === 'autoopen') { showAutoSell(); return; }
  else if (a === 'atog') {
    const k = F.minKeep(S), key = t.dataset.k;
    if (key === 'noncomune' && !F.hasPass(S)) { $('#modal').innerHTML = `<div class="mod" role="dialog" aria-modal="true"><h2>Serve il Pass Astrale</h2><p class="msub">Scartare in automatico anche i non comuni è incluso nel Pass Astrale. Vuoi aprire lo Shop?</p><div class="row2"><button class="sb" data-act="close">No, grazie</button><button class="pb" data-act="goshop">Vai allo Shop</button></div></div>`; $('#modal').hidden = false; return; }
    if (key === 'comune' && !F.hasPass(S) && S.maxZone < F.FREE_FILTER_ZONE) { toast(`Lo scarto dei comuni si sblocca alla zona ${F.FREE_FILTER_ZONE} (subito col Pass Astrale)`, '#F2C14E'); return; }
    if (key === 'comune') S.settings.minRarity = k >= 1 ? 'comune' : 'noncomune';
    else S.settings.minRarity = k >= 2 ? 'noncomune' : 'rara';
    if (F.minKeep(S) > k) { const r = F.sellBelow(S); if (r.n) toast(`Venduti ${r.n} oggetti per ${cfmt(r.gold)} oro`); }
  }
  else if (a === 'bigscene') { S.settings.bigScene = !S.settings.bigScene; applyBig(); save(); }
  else if (a === 'goshop') { closeModal(); tab = 'shop'; selItem = null; selRune = null; selShop = null; render(); const v = t.dataset.v, pn = $('#panel'); pn.scrollTop = 0; if (v) { const go = () => { const el = document.getElementById('shop-' + v); if (el) pn.scrollTop += el.getBoundingClientRect().top - pn.getBoundingClientRect().top - 6; }; go(); requestAnimationFrame(go); } return; }
  else if (a === 'setkeep') { S.settings.minRarity = t.dataset.k; dirty = true; showAutoSell(); return; }
  else if (a === 'pts') { F.addPts(S, id, t.dataset.k, +t.dataset.n); rebuild(); }
  else if (a === 'ptsauto') { F.autoPts(S, id); rebuild(); }
  else if (a === 'ptsreset') { F.resetPts(S, id); rebuild(); }
  else if (a === 'rrlock') { const i = +t.dataset.i; rrLocks = rrLocks.includes(i) ? rrLocks.filter(x => x !== i) : rrLocks.concat(i); }
  else if (a === 'reroll2') { if (F.rerollBonus(S, item, rrLocks)) { snd('coin'); toast('Bonus rimescolati', '#F49AC1'); } }
  else if (a === 'fuseopen') { showFuse(); return; }
  else if (a === 'fuse') { const it = F.fuse(S, t.dataset.k); if (it) { const r = F.ITEM_RARITY.find(x => x.key === it.rarity); snd('rare'); toast(`Fusione riuscita: <b style="color:${r.color}">${esc(F.itemName(it))}</b>`, r.color); } showFuse(); dirty = true; return; }
  else if (a === 'dmgtoggle') { showDmg = !showDmg; }
  else if (a === 'dmgreset') { S.dmgLog = { since: S.clock || 0, by: {}, zone: S.zone }; }
  else if (a === 'selrune') { selRune = selRune === t.dataset.k ? null : t.dataset.k; selItem = null; }
  else if (a === 'selshop') selShop = selShop === +t.dataset.i ? null : +t.dataset.i;
  else if (a === 'equipall') { const n = F.autoEquip(S); toast(n ? `Equipaggiati ${n} oggetti` : 'Nessun miglioramento disponibile'); }
  else if (a === 'sellrest') { const r = F.sellRest(S); toast(r.n ? `Venduti ${r.n} oggetti per ${cfmt(r.gold)} oro` : 'Niente da vendere'); }
  else if (a === 'eqto') { F.equipTo(S, item, id || $('#eqsel').value); selItem = null; eqSel = null; }
  else if (a === 'eqpick') { eqSel = eqSel === item ? null : item; }
  else if (a === 'protk') { F.toggleProtect(S, t.dataset.k); }
  else if (a === 'sell') { F.sellItem(S, item); selItem = null; }
  else if (a === 'equip') { selSlot = null; eqSel = null; showEquip(id); return; }
  else if (a === 'eqnav') { eqNav(+t.dataset.d); return; }
  else if (a === 'selslot') { const v = id + ':' + t.dataset.slot; selSlot = selSlot === v ? null : v; }
  else if (a === 'slotup') { if (confirmRune !== 'slot' + id + t.dataset.slot) { confirmRune = 'slot' + id + t.dataset.slot; toast('Tocca di nuovo per spendere gli Astri', '#F49AC1'); setTimeout(() => { confirmRune = null; }, 3000); return; } confirmRune = null; if (F.upgradeSlot(S, id, t.dataset.slot)) { snd('coin'); rebuild(); } }
  else if (a === 'sellrune1') { F.sellRunes(S, t.dataset.k, 1); }
  else if (a === 'sellruneall') { const g = F.sellRunes(S, t.dataset.k, S.runes[t.dataset.k]); toast(`+${g} Astri`); }
  else if (a === 'raise' && confirmRune !== 'raise' + item) { confirmRune = 'raise' + item; toast('Tocca di nuovo per usare la runa', '#F2C14E'); setTimeout(() => { confirmRune = null; }, 3000); return; }
  else if (a === 'raise') { confirmRune = null; const it = S.inventory.find(x => x.id === item); if (it && F.raiseRarity(S, it)) { toast(`Rarità migliorata: ${esc(F.itemName(it))}`, F.ITEM_RARITY.find(x => x.key === it.rarity).color); if (S.settings.autoEquip) F.autoEquip(S); } }
  else if (a === 'buy') { if (F.buyShop(S, +t.dataset.i)) toast('Acquistato: lo trovi nello zaino'); }
  else if (a === 'reroll') { selShop = null; if (F.rerollShop(S)) toast('Il mercante ha cambiato la merce', '#F49AC1'); }
  else if (a === 'skip') { skipTime(+t.dataset.h); return; }
  else if (a === 'sellbelow') { const r = F.sellBelow(S); toast(r.n ? `Venduti ${r.n} oggetti per ${cfmt(r.gold)} oro` : 'Niente sotto la soglia'); }
  else if (a === 'claim') { const r = F.claimMission(S, id); if (r) toast(`Missione completata: +${r.astri} Astri, +1 ${F.RUNE[r.rune[0]].label.toLowerCase()}`, '#F2C14E'); }
  else if (a === 'buyhero') { if (F.buyHero(S, id)) { toast(F.SPECIES[id].name + ' si unisce alla squadra! (versione di prova)', '#F2C14E'); rebuild(); } }
  else if (a === 'bagview') { bagView = t.dataset.v; selItem = null; }
  else if (a === 'tochest') { F.toChest(S, +t.dataset.item); selItem = null; }
  else if (a === 'fromchest') { F.fromChest(S, +t.dataset.item); selItem = null; }
  else if (a === 'givegold') { S.gold += +t.dataset.v; toast(`+${cfmt(+t.dataset.v)} oro`, '#F2C14E'); }
  else if (a === 'giveastri') { S.astri += +t.dataset.v; toast(`+${fmt(+t.dataset.v)} Astri`, '#F49AC1'); }
  else if (a === 'skybuy') { if (F.skyBuy(S, +t.dataset.id)) { const o = F.SKY[+t.dataset.id]; toast(`${o.ic} ${o.label} ${fmtPct(o.kind, o.v)}`, o.special ? '#FFFFFF' : F.SKY_SECTORS[o.sec].color); rebuild(); } }
  else if (a === 'skyzoom') { skyView.k = Math.max(10, Math.min(90, skyView.k * +t.dataset.z)); }
  else if (a === 'skycenter') { skyView = { x: 0, y: 0, k: 34 }; }
  else if (a === 'buyback') { if (F.buyBack(S, +t.dataset.i)) toast('Oggetto riacquistato', '#7ED36F'); }
  else if (a === 'buyslot') { if (F.buySlot(S)) { toast('Nuovo posto in squadra!', '#F2C14E'); rebuild(); } }
  else if (a === 'buypet') { if (F.buyPet(S, t.dataset.k)) { snd('rare'); toast(`${F.PETS[t.dataset.k].name} si unisce a te!`, '#F2C14E'); buildScene(); } }
  else if (a === 'welcome') { if (F.buyWelcome(S, t.dataset.k)) { snd('rare'); toast(`Pacchetto Benvenuto: ${F.PETS[t.dataset.k].name} + 500 Astri`, '#F2C14E'); buildScene(); } }
  else if (a === 'buyastri') { const n = F.buyAstri(S, +t.dataset.i); if (n) { snd('coin'); toast(`+${fmt(n)} Astri`, '#F49AC1'); } }
  else if (a === 'buygold') { const g = F.buyGold(S, +t.dataset.i); if (g) toast(`+${cfmt(g)} oro`, '#F2C14E'); }
  else if (a === 'buyspace') { if (F.buySpace(S, t.dataset.k)) toast(`+${F.SPACE_PACK.n} posti ${t.dataset.k === 'bag' ? 'nello zaino' : 'nel forziere'}`, '#F2C14E'); }
  else if (a === 'buyrune') { if (F.buyRune(S, t.dataset.k)) toast(`+1 ${F.RUNE[t.dataset.k].label.toLowerCase()}`, F.RUNE[t.dataset.k].color); }
  else if (a === 'daily') { const g = F.claimDaily(S); if (g) toast(`+${g} ${icon('gem', '#F49AC1', 14)} Astri: regalo del giorno`, '#F49AC1'); }
  else if (a === 'passoff') { F.deactivatePass(S); toast('Pass Astrale tolto', '#F2C14E'); }
  else if (a === 'pass') { F.activatePass(S); toast('Pass Astrale attivo per 30 giorni (versione di prova)', '#F2C14E'); }
  else if (a === 'zone') { if (F.setZone(S, +t.dataset.z)) { rebuild(); banner('ZONA ' + S.zone); } }
  else if (a === 'tree') { F.buyTree(S, t.dataset.k); }
  else if (a === 'treereset') { if (confirmTree > Date.now()) { const b = F.skyReset(S); confirmTree = 0; toast(`Recuperati ${cfmt(b)} oro`); rebuild(); } else confirmTree = Date.now() + 3000; }
  else if (a === 'reset') { if (confirmReset > Date.now()) { const tk = S.net && S.net.token; if (tk) api('rpc/it_unregister', { p_token: tk }).catch(() => {}); S = F.newState(); save(); rebuild(); confirmReset = 0; showWelcome(); } else confirmReset = Date.now() + 3000; }
  else if (a === 'capadd') { F.addToTeam(S, id); rebuild(); closeModal(); }
  else if (a === 'share') { const m = S.roster[id], d = F.SPECIES[m.species]; const txt = `Ho catturato ${m.name} (${F.RARITY[d.rarity].label}, ${d.cls}) in Frontiera Arcana dopo ${fmt(m.waitKills)} incontri!`; try { navigator.clipboard.writeText(txt).then(() => { t.textContent = 'Copiato!'; }, () => { t.textContent = 'Copia non riuscita'; }); } catch (err) { t.textContent = 'Copia non riuscita'; } return; }
  else if (a === 'close') { closeModal(); }
  else if (a === 'cmppick') { showCmpPick(id); return; }
  else if (a === 'cmp') { showCmp(t.dataset.a, t.dataset.b); return; }
  else if (a === 'tutnext') { const i = +t.dataset.i + 1; if (i < TUT.length) { showTutorial(i); return; } S.tutorial = 1; tutOn = false; save(); closeModal(); }
  else if (a === 'tutskip') { S.tutorial = 1; tutOn = false; save(); closeModal(); }
  else if (a === 'tutshow') { showTutorial(0); return; }
  else if (a === 'eqres' || a === 'lockm' || a === 'autoeq' || a === 'test' || a === 'minr' || a === 'prot' || a === 'sound' || a === 'vol') return; // gestiti da change
  if (a === 'tree' || a === 'treereset') { /* stelle cambiano le statistiche */ B.party.forEach(() => {}); }
  save(); render(); if (equipOpen && !$('#modal').hidden) { const y = $('#modal .mod') ? $('#modal .mod').scrollTop : 0; showEquip(equipOpen); if ($('#modal .mod')) $('#modal .mod').scrollTop = y; }
});
document.addEventListener('change', e => {
  const t = e.target; const a = t.dataset && t.dataset.act; if (!a) return;
  if (a === 'lockm') S.roster[t.dataset.id].locked = t.checked;
  if (a === 'autoeq') { S.settings.autoEquip = t.checked; if (t.checked) F.autoEquip(S); }
  if (a === 'test') S.settings.test = t.checked;
  if (a === 'minr') S.settings.minRarity = t.value;
  if (a === 'sound') { S.settings.sound = t.checked; if (t.checked) snd('coin'); }
  if (a === 'vol') { S.settings.volume = +t.value; snd('coin'); }
  if (a === 'eqres') { S.settings.eqReserve = t.checked; dirty = true; }
  if (a === 'prot') { S.settings.protect = t.value; dirty = true; }
  save(); render(); hud();
});
document.addEventListener('submit', e => {
  if (e.target.classList.contains('giveform')) { e.preventDefault(); const v = Math.floor(+$('#givev').value || 0); if (v > 0) { const k = e.submitter && e.submitter.dataset.give; if (k === 'astri') S.astri += v; else S.gold += v; toast(`+${cfmt(v)} ${k === 'astri' ? 'Astri' : 'oro'}`); save(); hud(); dirty = true; } return; }
  const f = e.target.closest('form.rename'); if (!f) return; e.preventDefault();
  const v = f.querySelector('input').value.trim(); if (v) { S.roster[f.dataset.id].name = v.slice(0, 16); save(); toast('Nome salvato'); }
  if (!$('#modal').hidden && f.closest('#modal')) { const h = $('#capname'); if (h) h.textContent = v; } else render();
});

// ---------- ciclo ----------
let last = performance.now(), saveAt = 0, achAt = 0, renderAt = 0;
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000); last = now;
  S.stats.played += dt;
  const speed = S.settings.test ? 5 : 1; let left = S.net && !tutOn ? dt * speed : 0; // fermo finché non c'è il nickname e durante il tutorial
  const ev = [];
  while (left > 0) { const d = Math.min(0.05, left); F.step(S, B, d, ev); left -= d; }
  handle(ev); updateScene(); hud();
  if (now - achAt > 1500) { achAt = now; for (const a of F.checkAch(S)) { S.achNew = (S.achNew || 0) + 1; dirty = true; } } // niente avvisi a schermo: solo il pallino su Stats
  if ($('#modal').hidden && capQueue.length) showCapture(capQueue.shift());
  if (dirty && !skyDrag && now - renderAt > 700 && now - scrollAt > 1500 && !touching && !document.activeElement.matches('input,select')) { renderAt = now; render(); }
  if (now - saveAt > 10000) { saveAt = now; if (F.ensureShop(S, Date.now())) toast('Il mercante ha nuovi oggetti', '#F49AC1'); save(); }
  requestAnimationFrame(frame);
}
function catchUp() {
  const away = (Date.now() - (S.lastSeen || Date.now())) / 1000;
  if (away > 30) { const id0 = S.nextId; const r = F.simulateOffline(S, away); r.since = id0; F.checkAch(S); save(); showOffline(r); }
  B = F.startBattle(S); buildScene();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) save();
  else { catchUp(); last = performance.now(); dirty = true; }
});
window.addEventListener('pagehide', save);

const had = load();
F.ensureShop(S, Date.now());
if (!S.settings) S.settings = { autoEquip: true, test: false };
if (had) catchUp(); else { B = F.startBattle(S); buildScene(); }
if (!S.net) showWelcome(); else if (!had && !S.tutorial) showTutorial(0);
banner('BATTAGLIA ' + S.battle);
setScroll(); applyBig(); render(); hud();
addEventListener('resize', applyBig);
requestAnimationFrame(t => { last = t; frame(t); });
})();

</script>
