<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Frontiera Arcana v0.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E24;--panel:#161A3A;--line:#2A3066;--txt:#EEF0FF;--muted:#A9B0D6;--gold:#F2C14E;--cyan:#7FE3F0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit}
#app{max-width:480px;margin:0 auto;position:fixed;top:0;bottom:0;left:0;right:0;height:auto;display:flex;flex-direction:column;overflow:hidden}
header{padding:6px 10px 5px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.title{font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:700}
#where{font-size:10.5px;color:var(--muted)}
.res{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:11.5px;font-weight:600}
.pbar{height:3px;background:#1E2350;border-radius:3px;overflow:hidden}.pbar b{display:block;height:100%;background:var(--gold);transition:width .3s}
#testbadge{font-size:10px;font-weight:700;color:#0B0E24;background:var(--gold);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
#scene{position:relative;height:118px;background-size:480px 150px;animation:scrollsky 90s linear infinite paused;flex-shrink:0;overflow:hidden;background-color:#141A4A;background-image:radial-gradient(1.5px 1.5px at 30px 30px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90px 80px,#cfd6ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 160px 20px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 220px 60px,#cfd6ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 300px 40px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 350px 90px,#cfd6ff 50%,transparent 51%),radial-gradient(1px 1px at 420px 30px,#fff 50%,transparent 51%)}
@keyframes drift{to{transform:translateX(-30px)}}
.planet{animation:drift 90s linear infinite alternate;position:absolute;right:26px;top:8px;width:28px;height:28px;border-radius:50%;background:#3B3F8F;box-shadow:inset -8px -6px 0 #2A2D6E}
.ring{position:absolute;right:16px;top:19px;width:48px;height:7px;border:2px solid #8C7BE0;border-radius:50%;transform:rotate(-14deg)}
.ground{position:absolute;left:0;right:0;bottom:0;height:28px;background-color:#2B3570;background-image:repeating-linear-gradient(90deg,#2B3570 0 36px,#26306A 36px 48px,#2B3570 48px 80px),radial-gradient(2px 2px at 20px 12px,#6B7BD1 50%,transparent 51%);background-size:80px 28px,80px 28px;border-top:4px solid #6B7BD1;animation:scrollground 1.4s linear infinite paused}
#scene.march,#scene.march .ground,#scene.march .hills{animation-play-state:running}
.hills{position:absolute;left:0;right:0;bottom:24px;height:40px;background-image:radial-gradient(60px 34px at 40px 40px,#232A62 98%,transparent 100%),radial-gradient(90px 44px at 170px 44px,#1E2458 98%,transparent 100%),radial-gradient(50px 26px at 300px 40px,#232A62 98%,transparent 100%);background-size:400px 40px;background-repeat:repeat-x;animation:scrollhills 9s linear infinite paused}
@keyframes scrollhills{to{background-position:-400px 0}}
#scene.march #units .u:not(.walk) .spr{animation:step .3s steps(2) infinite}
@keyframes step{50%{transform:translateY(-2px)}}
#units .u .hpb{width:20px;height:3px}
@keyframes scrollground{to{background-position:-80px 0,-80px 0}}
@keyframes scrollsky{to{background-position:-480px 0}}
.u.walk .spr{animation:walk .35s steps(2) infinite}@keyframes walk{50%{transform:scaleX(-1) translateY(-2px)}}
.lr.far{opacity:.55}.lr.far .lh{color:var(--muted);font-style:italic}
#units{position:absolute;inset:0;left:50%;width:390px;margin-left:-195px}
.u{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;transition:opacity .3s,filter .3s}
.u.dead{opacity:.25;filter:grayscale(1)}
.u.lg{animation:lg .18s ease-out}
@keyframes lg{50%{transform:translateX(var(--dx))}}
.hpb{width:34px;height:4px;background:#05060F;border:1px solid #000}.hpb b{display:block;height:100%}
.mk{position:absolute;top:-16px;display:none}.u.marked .mk{display:block}
.spr{position:relative;flex-shrink:0}.spr i{position:absolute;display:block}
.sil{filter:brightness(0) invert(.2)}
#fx{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;font-family:'Pixelify Sans',sans-serif;font-weight:700;font-size:13px;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000;transform:translateX(-50%);animation:fl .9s ease-out forwards;white-space:nowrap}
.fl.crit{color:var(--gold);font-size:16px}.fl.hurt{color:#FF8A96;font-size:11px}.fl.skill{color:#D8C2FF;font-size:12px}
@keyframes fl{to{transform:translate(-50%,-26px);opacity:0}}
#banner{position:absolute;left:0;right:0;top:8px;text-align:center;font-family:'Pixelify Sans',sans-serif;font-size:17px;font-weight:700;color:#fff;text-shadow:2px 2px 0 #000;opacity:0;pointer-events:none}
#banner.show{animation:bn 1.6s ease-out}
@keyframes bn{0%{opacity:0;transform:translateY(6px)}15%,70%{opacity:1;transform:none}100%{opacity:0}}
#log{flex-shrink:0;max-height:118px;overflow-y:auto;background:#0E1230;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 10px 4px;font-size:10.5px}
.lhead{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 0 2px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;row-gap:3px}
.pc{min-width:0}.pt{display:flex;align-items:center;gap:4px;font-size:10.5px;line-height:13px}
.pt i{width:6px;height:6px;border-radius:2px;flex-shrink:0}.pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pd{font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums;font-size:10px}
.hbar{height:3px;background:#1E2350;border-radius:2px;overflow:hidden;margin-top:1px}.hbar b{display:block;height:100%;transition:width .2s}
.pc.ko{opacity:.4}.pc.ko .pd{color:#FF8A96}.pc.mvp .pd{color:#FFD97A}
#panel{flex:1;overflow-y:auto;padding:2px 10px 12px;min-height:0;font-size:13px}
#toasts{position:absolute;left:12px;right:12px;bottom:78px;display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none}
.toast{background:rgba(22,26,58,.96);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:8px;padding:8px 10px;font-size:12.5px;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
nav{display:flex;gap:2px;padding:3px 6px calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0E1230;flex-shrink:0}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:44px;padding:4px 0;background:none;border:none;border-radius:8px;color:var(--muted);font-size:9px;font-weight:600;cursor:pointer}
.tab[aria-current=page]{color:var(--gold);background:#1E2350}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 5px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-family:'Pixelify Sans',sans-serif;font-size:15px;color:var(--gold)}.ph span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:5px}
.note{font-size:11px;color:var(--muted);margin:3px 0 6px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:4px;font-size:11px}.chip i{width:8px;height:8px;border-radius:2px}.chip em{color:var(--gold);font-style:normal;font-weight:700}
.mrow{display:flex;align-items:center;gap:4px;padding:3px 6px}
.mhead{flex:1;display:flex;align-items:center;gap:8px;background:none;border:none;color:inherit;text-align:left;padding:1px;cursor:pointer;min-height:40px;min-width:0}
.mspr{width:34px;display:flex;justify-content:center}
.minfo{flex:1;min-width:0}.mname{font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px}.msub{font-size:10.5px;color:var(--muted);margin-top:1px}
.xp{height:3px;background:#1E2350;border-radius:2px;margin-top:3px;overflow:hidden}.xp b{display:block;height:100%;background:var(--cyan)}
.mbtns{display:flex;gap:4px}
.ib{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:#1E2350;border:1px solid var(--line);border-radius:8px;color:var(--txt);cursor:pointer}
.ib:disabled{opacity:.3}
.sb,.pb,.discord{min-height:36px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#1E2350;color:var(--txt)}
.pb{background:var(--gold);color:#1B1430;border:none;font-weight:700}
.discord{background:#5865F2;border:none;color:#fff}
.sb:disabled,.pb:disabled{opacity:.4;cursor:default}
.wide{width:100%;margin-top:8px}.danger{color:#FF8A96;border-color:#5A2A3A}
.row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0}
.row2>*{flex:1}
.tg{display:flex;gap:8px;align-items:center;font-size:12px;margin:4px 0;min-height:36px}.tg input{width:18px;height:18px;accent-color:var(--gold)}
.detail{margin-top:-4px}
.stats{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}.stats b{color:var(--txt)}
.abil{font-size:12px;color:#D5DAF5;margin:8px 0}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.slot{display:flex;flex-direction:column;gap:1px;text-align:left;background:#10143A;border:1.5px solid var(--line);border-radius:6px;padding:4px 6px;color:inherit;font-size:11px;cursor:pointer;min-height:38px}
.slot span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.slot em{font-size:10.5px;color:var(--muted);font-style:normal}
.slot.empty{border-style:dashed;cursor:default}
.rename{display:flex;gap:8px;align-items:center;margin-top:8px}.rename label{font-size:12px;color:var(--muted)}
.rename input{flex:1;min-width:0;min-height:40px;background:#10143A;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:0 10px;font-size:14px}
select{min-height:40px;background:#10143A;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:0 8px;font-size:13px}
.row2 label{font-size:12px;color:var(--muted);flex:0 0 auto}
.free{font-size:12px;color:var(--muted);border-style:dashed}
.lockgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0 8px}
.lk{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px dashed #3A4180;border-radius:8px;padding:6px 2px;font-size:9.5px;color:var(--muted);text-align:center}
.igrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.it{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;background:#10143A;border:2px solid;border-radius:6px;padding:4px 2px;color:var(--txt);cursor:pointer;min-height:48px}
.it em{font-size:8.5px;color:var(--muted);font-style:normal;white-space:nowrap;overflow:hidden;max-width:100%}.it b{font-size:11.5px}
.it i{position:absolute;top:-7px;right:-4px;font-size:8.5px;font-style:normal;background:var(--gold);color:#1B1430;border-radius:4px;padding:0 3px;font-weight:700}
.it.sel{outline:2px solid #fff;outline-offset:1px}
.iname{font-weight:700;font-size:15px}
.idet{border-width:2px}
.bar{height:6px;background:#1E2350;border-radius:3px;overflow:hidden}.bar b{display:block;height:100%;background:var(--cyan)}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.best{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;margin:0}
.bspr{height:40px;display:flex;align-items:flex-end}.best b{font-size:12px}.best span{font-size:10.5px}.best em{font-size:11px;color:var(--gold);font-style:normal}.best small{font-size:10.5px;color:var(--muted)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px}.trow .sb{flex:0 0 auto}
.lvl{font-size:12px;color:var(--muted)}
.pips{display:flex;gap:3px;margin-top:6px}.pips i{width:10px;height:10px;border-radius:50%;border:1px solid #3A4180}.pips i.on{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.sgrid div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}.sgrid span{display:block;font-size:10px;color:var(--muted)}.sgrid b{font-size:14px}
canvas{width:100%;height:auto;display:block;margin-top:6px}
.arow{display:flex;gap:10px;align-items:center;opacity:.6}.arow.done{opacity:1;border-color:#3B6E45}
#modal{position:absolute;inset:0;background:rgba(5,6,18,.86);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.mod{width:100%;max-width:400px;max-height:100%;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px}
.mod h2{font-family:'Pixelify Sans',sans-serif;font-size:28px;margin:6px 0;text-align:center}
.cap{text-align:center}
.kick{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--gold)}
.halo{height:150px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(160,107,230,.45) 0%,rgba(160,107,230,.1) 50%,transparent 70%)}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.badges{display:flex;gap:8px;justify-content:center}.rb{font-size:12px;font-weight:700;color:var(--gold);border:1.5px solid var(--gold);border-radius:999px;padding:3px 10px}.cb{font-size:12px;font-weight:700;color:#0B0E24;border-radius:999px;padding:4px 10px}
.quote{font-style:italic;color:#D5DAF5;font-size:14px;line-height:1.45}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}.kv span{color:var(--muted);text-align:left}
.cap .rename{text-align:left}
.slotbox{display:flex;flex-direction:column;gap:4px}
.slup{min-height:30px;border-radius:8px;border:1px solid #2C5C70;background:#10243A;color:#BFF3FA;font-size:11px;font-weight:600;cursor:pointer}.slup:disabled{opacity:.4;cursor:default}
.slv{color:#5BD8E6;font-size:11px}
.stbox{background:#0C0F2A;border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin:6px 0;font-size:11.5px}
.srow2{display:flex;justify-content:space-between;padding:1px 0}.srow2 span{color:var(--muted);display:flex;align-items:center;gap:5px}.srow2 b{font-variant-numeric:tabular-nums}
.srow2.bon span{color:#D5DAF5}.srow2.bon i{width:6px;height:6px;display:inline-block}.srow2.val{border-top:1px solid var(--line);margin-top:3px;padding-top:3px}

.it .upar{position:absolute;top:2px;left:3px;font-style:normal;font-size:9px;color:#7ED36F;background:none;padding:0}
.passc{display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:#6B5A20;background:#1E1A0C}.passc .pb{flex:0 0 auto;line-height:1.1;padding:4px 12px}.passc small{font-size:9px;font-weight:600}

.mrow .mbtns{flex-direction:column;gap:2px}.mrow .mbtns .ib{height:20px;width:28px}
.eqmod .eqhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.eqmod .eqgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.eqmod .eqt{min-height:56px}
.fl.heal{color:#7ED36F;font-size:12px}

.eqt span{font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;max-width:100%}.eqt.empty{border-style:dashed;opacity:.7}.eqt.empty span{color:var(--muted);font-weight:400}

.eqt.sel{outline:2px solid #fff;outline-offset:1px}.eqdet{margin-top:6px}
.it span,.it svg{display:block}

.mrew{display:flex;align-items:center;gap:2px;color:var(--txt)}.mdone{color:#7ED36F}

const starCost = (base, g) => l => Math.round(base * Math.pow(g, l));

function rnd(st) { // mulberry32 sul seed dello stato, così la simulazione è riproducibile
  let t = (st.seed = (st.seed + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function pickWeighted(st, list, w) { let tot = 0; for (const x of list) tot += w(x); let r = rnd(st) * tot; for (const x of list) { r -= w(x); if (r <= 0) return x; } return list[list.length - 1]; }

}

// ---------- Statistiche degli oggetti ----------
// Statistiche principali dal tipo; statistiche bonus casuali: 0 comune, 1 non comune, 2 rara, 3 epica, 4 leggendaria
const STAT_LABEL = { atk: 'Danni', hp: 'PV massimi', def: 'Difesa', crit: 'Prob. critico', critDmg: 'Danni critici', aspd: "Vel. d'attacco", block: 'Blocco', dodge: 'Schivata' };
const PCT_STATS = ['crit', 'critDmg', 'aspd', 'block', 'dodge'];
const BONUS_KEYS = ['atk', 'hp', 'def', 'crit', 'critDmg', 'aspd', 'block', 'dodge'];
const BONUS_DEF = { atk: 0.12, hp: 0.8, def: 0.04, crit: 0.02, critDmg: 0.08, aspd: 0.04, block: 0.03, dodge: 0.03 };
const SUFFIX = { atk: 'della Furia', hp: 'del Gigante', def: 'della Roccia', crit: 'del Falco', critDmg: 'della Tempesta', aspd: 'del Vento', block: 'del Bastione', dodge: "dell'Ombra" };

const rarMult = k => ITEM_RARITY.find(r => r.key === k).mult;
function itemBase(it) { return 4 * Math.pow(1.04, it.ilvl) * rarMult(it.rarity) * (1 + 0.1 * (it.up || 0)); }
function pctScale(it) { return Math.sqrt(rarMult(it.rarity)) * (1 + it.ilvl / 300); }
function mainStats(it) {
  const P = itemBase(it), q = pctScale(it), c = it.cls, o = {};
  switch (it.slot) {
    case 'arma': if (c === 'Tank') { o.atk = P * 0.4; o.def = P * 0.15; } else if (c === 'Arciere') { o.atk = P * 0.6; o.crit = 0.02 * q; } else if (c === 'Curatore') o.atk = P * 0.5; else o.atk = P * 0.7; break;
    case 'secondaria': if (c === 'Tank') { o.def = P * 0.3; o.block = 0.03 * q; } else if (c === 'Arciere') { o.atk = P * 0.2; o.crit = 0.015 * q; } else if (c === 'Guerriero') { o.atk = P * 0.25; o.aspd = 0.03 * q; } else o.atk = P * 0.3; break;
    case 'elmo': o.hp = P * 1.5; o.def = P * 0.05; break;
    case 'corazza': o.hp = P * 3; o.def = P * 0.1; o.block = 0.01 * q; break;
    case 'gambe': o.hp = P * 2; o.def = P * 0.05; break;

function bonusValue(it, b) { return PCT_STATS.includes(b.k) ? BONUS_DEF[b.k] * b.r * pctScale(it) : BONUS_DEF[b.k] * b.r * itemBase(it); }

function rollBonus(s, it) { const have = (it.bonus || []).map(b => b.k), pool = BONUS_KEYS.filter(k => !have.includes(k)); const k = pool[Math.floor(rnd(s) * pool.length)]; it.bonus = (it.bonus || []).concat([{ k, r: 0.5 + rnd(s) * 0.5 }]); }

function itemName(it) { const base = it.slot === 'arma' ? WEAPON[it.cls] : it.slot === 'secondaria' ? SECONDARY[it.cls] : ITEM_NAME[it.slot]; const b = it.bonus && it.bonus[0]; return b ? base + ' ' + SUFFIX[b.k] : base; }
function upgradeCost(it) { return Math.round(itemPower(it) * 6 * (1 + it.up)); }
function sellValue(it) { return Math.round(itemPower(it) * 1.5); }
function canUse(m, it) { return (it.slot !== 'arma' && it.slot !== 'secondaria') || it.cls === SPECIES[m.species].cls; }
// posto in cui va l'oggetto: quello libero o il più debole tra quelli del suo tipo
function targetSlot(m, it) { let best = null, bp = Infinity; for (const sl of SLOTS) { if (kindOf(sl) !== it.slot) continue; const c = m.eq[sl], p = c ? itemPower(c) : -1; if (p < bp) { bp = p; best = sl; } } return best; }

function classCounts(s) { const c = { Tank: 0, Guerriero: 0, Arciere: 0, Mago: 0, Curatore: 0 }; for (const id of s.team) c[SPECIES[s.roster[id].species].cls]++; return c; }

function memberStats(s, id) {
  const m = s.roster[id], cls = SPECIES[m.species].cls, b = CLASSES[cls];
  const lm = 1 + 0.15 * (m.lvl - 1);
  let hp = b.hp * lm, atk = b.atk * lm, def = b.def * lm, crit = 0.05, critDmg = 1.5;
  let aspd = 0, block = 0, dodge = 0;

    const it = m.eq[sl]; if (!it) continue; const sm = 1 + 0.1 * ((m.slv && m.slv[sl]) || 0), st = itemStats(it);
    atk += (st.atk || 0) * sm; hp += (st.hp || 0) * sm; def += (st.def || 0) * sm;
    crit += (st.crit || 0) * sm; critDmg += (st.critDmg || 0) * sm; aspd += (st.aspd || 0) * sm; block += (st.block || 0) * sm; dodge += (st.dodge || 0) * sm;
  }
  if (SPECIES[m.species].hero) hp *= 1 + 0.06 * s.tree.vita; else hp *= 1 + 0.06 * s.tree.branco;
  atk *= 1 + 0.05 * s.tree.forza;
  def *= 1 + 0.05 * s.tree.scudo;
  crit += 0.01 * s.tree.lama;
  return { hp: Math.round(hp), atk: Math.round(atk), def: Math.round(def * 10) / 10, spd: b.spd / (1 + Math.min(aspd, 1)), crit: Math.min(crit, 0.75), critDmg, block: Math.min(block, 0.5), dodge: Math.min(dodge, 0.4), aspd: Math.min(aspd, 1), cls };
}

// ---------------- Battaglia ----------------
// Curva a tre tratti: le prime battaglie volano, poi la difficoltà accelera (prima parte facile, muro verso il boss)
// Ogni zona: prime battaglie facili, poi accelera verso il boss. Ogni zona nuova parte un po' sotto il boss della precedente.
function withinZone(n) {
  const a = Math.min(n, 10) - 1, b = Math.max(0, Math.min(n, 20) - 10), c = Math.max(0, n - 20);
  return Math.pow(1.03, a) * Math.pow(1.07, b) * Math.pow(1.12, c);
}
// Passo tra le zone: sul primo pianeta più dolce, sul secondo più ripido (la squadra è già grande)
const ZONE_K = [0, 0, 0.55, 0.55, 0.55, 0.55, 0.45, 0.45, 0.45, 0.45, 0.45];
const ZONE_BASE = [0, 1]; for (let z = 2; z <= 10; z++) ZONE_BASE[z] = ZONE_BASE[z - 1] * withinZone(30) * ZONE_K[z];
function enemyScale(z, n) { return ZONE_BASE[z] * withinZone(n); }

function makeEnemies(s) {
  const n = s.battle, Z = ZONES[s.zone], f = enemyScale(s.zone, n), pool = Z.pool;
  const list = [];
  const count = n === BOSS_BATTLE ? 2 : 3;
  for (let i = 0; i < count; i++) list.push(pickWeighted(s, pool, k => RARITY[SPECIES[k].rarity].weight));
  if (n === BOSS_BATTLE) list.unshift(Z.boss);
  return list.map((sp, i) => {
    const cls = SPECIES[sp].cls, boss = n === BOSS_BATTLE && i === 0, b = CLASSES[cls];
    const big = s.zone % 5 === 0; // i boss di pianeta (zone 5 e 10) sono più duri
    const hp = Math.round(b.hp * 0.45 * f * (boss ? (big ? 8 : 4) : 1));
    return { side: 'e', idx: i, species: sp, cls, boss, hp, maxHp: hp, atk: b.atk * 0.46 * f * (boss ? (big ? 1.6 : 1.3) : 1), def: b.def * 0.5 * f, spd: b.spd * 1.15, crit: 0.05, critDmg: 1.5, t: rnd(s) * b.spd, mark: 0, hits: 0, ab: 0, dealt: 0, taken: 0, arrive: (0.6 + i * 1.1) / moveSpeed(s), arriveMax: (0.6 + i * 1.1) / moveSpeed(s) };
  });
}

// La vita NON si ricarica tra una battaglia e l'altra: solo i Curatori curano.
// Si torna a vita piena quando cambia la zona, quando la zona ricomincia dopo il boss o quando la squadra cade.
function startBattle(s) {
  s.runHp = s.runHp || {};
  const party = s.team.map((id, i) => { const st = memberStats(s, id), fr = s.runHp[id] === undefined ? 1 : s.runHp[id]; return { side: 'p', idx: i, id, species: s.roster[id].species, cls: st.cls, hp: Math.round(st.hp * fr), maxHp: st.hp, atk: st.atk, def: st.def, spd: st.spd, crit: st.crit, critDmg: st.critDmg, block: st.block, dodge: st.dodge, t: rnd(s) * st.spd, mark: 0, hits: 0, ab: 0, dealt: 0, taken: 0 }; });
  return { party, enemies: makeEnemies(s), time: 0, over: null, pause: 0 };
}

function alive(list) { return list.filter(u => u.hp > 0); }
function ready(list) { return list.filter(u => u.hp > 0 && !(u.arrive > 0)); }
function frontTarget(list) {
  const a = ready(list); if (!a.length) return null;
  const tank = a.find(u => u.cls === 'Tank'); return tank || a[0];
}

function dealDamage(s, b, src, dst, mult, ignoreDef, ev) {
  if (dst.dodge && rnd(s) < dst.dodge) { if (ev) ev.push({ type: 'dodge', side: dst.side, idx: dst.idx }); return; }
  let dmg = src.atk * mult;
  let crit = false;
  if (rnd(s) < src.crit) { dmg *= src.critDmg; crit = true; }
  if (!ignoreDef) dmg -= dst.def;
  if (dst.mark > 0) dmg *= 1.3;
  if (dst.cls === 'Tank' && dst.side === 'p') dmg *= 0.7;
  if (dst.block && rnd(s) < dst.block) dmg *= 0.5;
  dmg = Math.max(1, Math.round(dmg));
  const real = Math.min(dmg, dst.hp); src.dealt += real; dst.taken += real;
  dst.hp -= dmg;
  if (ev) ev.push({ type: 'dmg', side: dst.side, idx: dst.idx, dmg, crit });
  if (dst.hp <= 0) { dst.hp = 0; if (dst.side === 'e') onKill(s, b, dst, ev); }
}

function attack(s, b, u, ev) {
  const foes = u.side === 'p' ? b.enemies : b.party;
  const tgt = u.side === 'e' ? frontTarget(foes) : ready(foes)[0];
  if (!tgt) return;
  u.hits++;
  if (ev) ev.push({ type: 'atk', side: u.side, idx: u.idx });
  if (u.side === 'p' && u.cls === 'Guerriero' && u.hits % 3 === 0) {
    if (ev) ev.push({ type: 'skill', side: 'p', idx: u.idx, name: 'Fendente!' });
    dealDamage(s, b, u, tgt, 2.2, false, ev);
    return;
  }
  if (u.side === 'p' && u.cls === 'Arciere' && u.hits % 3 === 0) {
    tgt.mark = 4; if (ev) ev.push({ type: 'skill', side: 'p', idx: u.idx, name: 'Marchio!' });
  }
  dealDamage(s, b, u, tgt, 1, false, ev);
}

function step(s, b, dt, ev) {
  if (b.over) { b.pause -= dt; if (b.pause <= 0) finishBattle(s, b, ev); return; }
  b.time += dt;
  for (const u of b.party.concat(b.enemies)) {
    if (u.hp <= 0) continue;
    if (u.arrive > 0) { u.arrive -= dt; continue; }
    if (u.mark > 0) u.mark -= dt;
    if (u.side === 'p' && u.cls === 'Curatore') {
      u.ab += dt;
      if (u.ab >= 3) {
        let w = null; for (const a of b.party) if (a.hp > 0 && a.hp < a.maxHp && (!w || a.hp / a.maxHp < w.hp / w.maxHp)) w = a;
        if (w) { u.ab = 0; const h = Math.round(Math.min(w.maxHp - w.hp, w.maxHp * 0.10 + u.atk * 1.5)); w.hp += h; u.healed = (u.healed || 0) + h; if (ev) ev.push({ type: 'heal', idx: w.idx, h }); }
      }
    }
    if (u.side === 'p' && u.cls === 'Mago') {
      u.ab += dt;
      const tg = ready(b.enemies)[0];
      if (u.ab >= 5 && tg) { u.ab = 0; if (ev) ev.push({ type: 'skill', side: 'p', idx: u.idx, name: 'Fulmine arcano!' }); dealDamage(s, b, u, tg, 2.5, true, ev); }
    }
    u.t -= dt;
    if (u.t <= 0) { u.t += u.spd; attack(s, b, u, ev); }
  }
  if (!alive(b.enemies).length) { b.over = 'win'; b.pause = 1.0 / moveSpeed(s); }
  else if (!alive(b.party).length) { b.over = 'lose'; b.pause = 1.5; }
  else if (b.time > 90) { b.over = 'lose'; b.pause = 1.5; } // stallo
}

function finishBattle(s, b, ev) {
  s.runHp = {}; for (const u of b.party) s.runHp[u.id] = Math.max(0, u.hp) / u.maxHp;
  if (b.over === 'win') {
    s.stats.wins++;
    if (s.battle === BOSS_BATTLE) {
      const first = s.zone > s.cleared;
      if (first) {
        s.cleared = s.zone;
        if (SLOT_UNLOCKS.includes(s.zone)) { // nuovo posto: entra la creatura più forte della riserva
          const res = Object.keys(s.roster).filter(id => !s.team.includes(id) && !isHero(id)).sort((a, c) => s.roster[c].lvl - s.roster[a].lvl);
          if (res.length && !teamFull(s)) s.team.push(res[0]);
          if (ev) ev.push({ type: 'unlock', text: 'Nuovo posto in squadra sbloccato!' });
        }
        if (s.zone < MAX_ZONE) { s.maxZone = Math.max(s.maxZone, s.zone + 1); s.zone++; s.maxBattle = 1; if (ev) ev.push({ type: 'unlock', text: `Zona ${s.zone} sbloccata!` }); }
      }
      s.battle = 1; s.runHp = {}; // la campagna avanza; le zone già finite ricominciano dalla battaglia 1
    } else s.battle++;
    if (s.zone === s.maxZone) s.maxBattle = Math.max(s.maxBattle, s.battle);
    s.maxGlobal = Math.max(s.maxGlobal || 1, gIndex(s.zone, s.battle));

const sprCache = {};
function sprite(key, p, opts) {
  opts = opts || {};

  }
  const c = sprCache[ck];
  return `<div class="spr${opts.sil ? ' sil' : ''}" style="width:${c.w}px;height:${c.h}px${opts.flip ? ';transform:scaleX(-1)' : ''}" aria-hidden="true"><i style="width:${p}px;height:${p}px;left:-${p}px;top:-${p}px;box-shadow:${c.bs}"></i></div>`;
}

let S;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { S = F.migrate(JSON.parse(raw)); return true; } } catch (e) { /* storage non disponibile */ }
  S = F.newState(); return false;
}
function save() { S.lastSeen = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignora */ } }

let B; // battaglia corrente (non salvata)
let tab = 'squadra', bagView = 'zaino', dirty = true, selItem = null, selSlot = null, equipOpen = null, eqSel = null, openMember = null, confirmReset = 0, confirmTree = 0;

// ---------- scena ----------
const scene = () => $('#scene');
let pEls = [], eEls = [];
function orderFront(list) {
  const rank = { Tank: 0, Guerriero: 1, Arciere: 2, Mago: 3, Curatore: 4 };
  return list.map((u, i) => ({ u, i })).sort((a, b) => rank[a.u.cls] - rank[b.u.cls] || a.i - b.i);
}
function buildScene() {
  const sc = $('#units'); sc.innerHTML = '';
  pEls = []; eEls = [];
  const isRanged = c => c === 'Arciere' || c === 'Mago' || c === 'Curatore';
  // squadra: mischia davanti, a distanza dietro con uno stacco
  const melee = orderFront(B.party).filter(o => !isRanged(o.u.cls)), ranged = orderFront(B.party).filter(o => isRanged(o.u.cls));
  const place = (list, x0) => list.forEach(({ u }, k) => {
    const x = x0 - k * 15, y = 26 + (k % 2) * 6;
    const el = document.createElement('div'); el.className = 'u'; el.style.left = x + 'px'; el.style.bottom = y + 'px'; el.style.zIndex = 20 - (k % 2) * 5;
    el.innerHTML = `<div class="hpb"><b style="background:#7ED36F"></b></div>${sprite(u.species, 2)}`;
    sc.appendChild(el); pEls[u.idx] = el;
  });
  place(melee, 168);
  place(ranged, (melee.length ? 168 - melee.length * 15 - 34 : 168));
  // nemici: quelli da mischia si ammassano sul primo bersaglio, quelli a distanza restano indietro
  let mk = 0, rk = 0;
  B.enemies.forEach(u => {
    const bp = u.boss ? 3 : 2, r = isRanged(u.cls);
    const x = r ? 248 + (rk++) * 12 : 190 + (mk++) * 7 - (u.boss ? 6 : 0), y = 26 + ((r ? rk : mk) % 2) * 5;
    const el = document.createElement('div'); el.className = 'u'; el.dataset.x = x; el.style.left = '420px'; el.style.bottom = y + 'px'; el.style.zIndex = 15 - (mk % 3);
    el.innerHTML = `<div class="hpb"><b style="background:#FF5A6E"></b></div><div class="mk">${icon('dust', '#7ED36F', 10)}</div>${sprite(u.species, bp, { flip: true })}`;
    sc.appendChild(el); eEls[u.idx] = el;
  });
  buildLog();
  logAt = -1e9;
  updateScene();
}
// Vita della squadra, stilizzata: barra sottile + danno medio al secondo (media mobile, non si azzera tra le battaglie)
let logRows = [];
const dps = {}, lastDealt = {}, acc = {};
let dpsAt = 0;
function buildLog() {
  const box = $('#log'); logRows = [];
  box.innerHTML = `<div class="lhead"><span id="alive"></span><span>danno medio / s</span></div><div class="pgrid">${B.party.map(u => `<div class="pc"><div class="pt"><i style="background:${F.CLASSES[u.cls].color}"></i><span class="pn">${esc(S.roster[u.id].name)}</span><b class="pd"></b></div><div class="hbar"><b></b></div></div>`).join('')}</div>`;
  const cells = box.querySelectorAll('.pc');
  B.party.forEach((u, i) => { logRows.push([u, cells[i]]); lastDealt[u.idx] = 0; });
}
let logAt = 0;
function updateLog() {
  const now = performance.now();
  for (const [u] of logRows) { const d = u.dealt - (lastDealt[u.idx] || 0); if (d > 0) acc[u.id] = (acc[u.id] || 0) + d; lastDealt[u.idx] = u.dealt; }
  if (now - dpsAt >= 1000) {
    const sec = (now - dpsAt) / 1000; dpsAt = now;
    for (const [u] of logRows) { const v = (acc[u.id] || 0) / Math.min(sec, 2) * (S.settings.test ? 0.2 : 1); dps[u.id] = dps[u.id] === undefined ? v : dps[u.id] * 0.85 + v * 0.15; acc[u.id] = 0; }
  }
  if (now - logAt < 250) return; logAt = now;
  let alive = 0; const top = Math.max(1, ...logRows.map(([u]) => dps[u.id] || 0));
  for (const [u, c] of logRows) {
    const pct = Math.max(0, u.hp / u.maxHp); if (u.hp > 0) alive++;
    const b = c.lastChild.firstChild; b.style.width = (100 * pct) + '%';
    b.style.background = pct > 0.6 ? '#7ED36F' : pct > 0.3 ? '#F2C14E' : '#FF5A6E';
    c.querySelector('.pd').textContent = u.hp > 0 ? cfmt(dps[u.id] || 0) : 'KO';
    c.classList.toggle('ko', u.hp <= 0);
    c.classList.toggle('mvp', u.hp > 0 && (dps[u.id] || 0) >= top && top > 1);
  }
  const a = $('#alive'); if (a) a.textContent = `Squadra ${alive}/${logRows.length}`;
}
let marching = null;
function updateScene() {
  const en = B.enemies.filter(u => u.hp > 0);
  const m = B.over === 'win' || (en.length > 0 && en.every(u => u.arrive > 0));
  if (m !== marching) { marching = m; scene().classList.toggle('march', m); }
  B.party.forEach(u => { const el = pEls[u.idx]; if (!el) return; el.firstChild.firstChild.style.width = (100 * u.hp / u.maxHp) + '%'; el.classList.toggle('dead', u.hp <= 0); });
  B.enemies.forEach(u => { const el = eEls[u.idx]; if (!el) return; const tx = +el.dataset.x; el.style.left = (u.arrive > 0 ? tx + (420 - tx) * (u.arrive / u.arriveMax) : tx) + 'px'; el.classList.toggle('walk', u.arrive > 0); el.firstChild.firstChild.style.width = (100 * u.hp / u.maxHp) + '%'; el.classList.toggle('dead', u.hp <= 0); el.classList.toggle('marked', u.mark > 0); });
  updateLog();
}
let floats = 0;
function floatText(el, text, cls) {
  if (!el || floats > 24) return;
  const sc = scene().getBoundingClientRect(), r = el.getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'fl ' + (cls || ''); f.textContent = text;
  f.style.left = (r.left - sc.left + r.width / 2 + (Math.random() * 20 - 10)) + 'px'; f.style.top = (r.top - sc.top - 6) + 'px';
  $('#fx').appendChild(f); floats++;
  setTimeout(() => { f.remove(); floats--; }, 900);
}
function lunge(el, dir) { if (!el) return; el.style.setProperty('--dx', dir + 'px'); el.classList.remove('lg'); void el.offsetWidth; el.classList.add('lg'); }
function banner(text) { const b = $('#banner'); b.textContent = text; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }

function setScroll() { const g = document.querySelector('.ground'); if (g) g.style.animationDuration = (1.4 / F.moveSpeed(S)) + 's'; }
// ---------- notifiche ----------
function toast(html, color) {
  const box = $('#toasts'); while (box.children.length >= 3) box.firstChild.remove();
  const t = document.createElement('div'); t.className = 'toast'; if (color) t.style.borderLeftColor = color; t.innerHTML = html; box.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ---------- eventi della simulazione ----------
const capQueue = [];
let lvlToastAt = 0;
function handle(ev) {
  for (const e of ev) {
    if (e.type === 'dmg') { const el = (e.side === 'p' ? pEls : eEls)[e.idx]; floatText(el, (e.crit ? 'CRIT ' : '') + cfmt(e.dmg), e.crit ? 'crit' : (e.side === 'p' ? 'hurt' : '')); }
    else if (e.type === 'atk') { lunge((e.side === 'p' ? pEls : eEls)[e.idx], e.side === 'p' ? 8 : -8); }
    else if (e.type === 'skill') { floatText(pEls[e.idx], e.name, 'skill'); }
    else if (e.type === 'heal') { floatText(pEls[e.idx], '+' + cfmt(e.h), 'heal'); }
    else if (e.type === 'kill') { dirty = true; }
    else if (e.type === 'drop') { const r = F.ITEM_RARITY.find(x => x.key === e.item.rarity); if (e.item.rarity !== 'comune') toast(`Trovato: <b class="${r.rainbow ? 'rbw' : ''}" style="color:${r.color}">${esc(F.itemName(e.item))}</b> · ${r.label}`, r.color); dirty = true; }
    else if (e.type === 'level') { const now = Date.now(); if (now - lvlToastAt > 4000) { lvlToastAt = now; toast(`${esc(S.roster[e.id].name)} sale al livello ${e.lvl}`); } dirty = true; }
    else if (e.type === 'capture') { capQueue.push(e.species); dirty = true; }

function drawChart() {
  const cv = $('#chart'); if (!cv) return; const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  const now = Math.floor(Date.now() / 60000), vals = [];
  for (let m = now - 29; m <= now; m++) { const r = S.stats.perMin.find(x => x.m === m); vals.push(r ? r.kills : 0); }
  const max = Math.max(1, ...vals), bw = (W - 50) / 30;
  g.strokeStyle = '#2A3066'; g.fillStyle = '#A9B0D6'; g.font = '20px Inter, sans-serif';
  g.beginPath(); g.moveTo(44, H - 30); g.lineTo(W, H - 30); g.stroke();
  g.fillText(String(max), 4, 22); g.fillText('0', 18, H - 34); g.fillText('-30 min', 44, H - 6); g.fillText('ora', W - 40, H - 6);
  g.fillStyle = '#7FE3F0';
  vals.forEach((v, i) => { const h = (H - 50) * v / max; g.fillRect(48 + i * bw, H - 30 - h, bw - 4, h); });
}

   <p class="msub">Mentre eri via (${h >= 48 ? Math.round(h / 24) + ' giorni' : h + ' h ' + mi + ' min'}${!r.skip && r.seconds >= F.offlineCap(S) ? `, massimo ${F.offlineCap(S) / 3600} ore${F.hasPass(S) ? '' : ' (8 col Pass)'}` : ''}) la squadra ha combattuto da sola.</p>
   <div class="card"><div class="kv"><span>Nemici sconfitti</span><b>${fmt(r.kills)}</b></div><div class="kv"><span>Oro</span><b>+${cfmt(r.gold)}</b></div><div class="kv"><span>Oggetti trovati</span><b>${fmt(r.items)}</b></div>${F.ITEM_RARITY.filter(x => r.byRar && r.byRar[x.key] > 0).map(x => `<div class="kv sub"><span class="${x.rainbow ? 'rbw' : ''}" style="color:${x.color}">· ${x.label}</span><b>${fmt(r.byRar[x.key])}</b></div>`).join('')}${Object.keys(r.runes).filter(k => r.runes[k] > 0).map(k => `<div class="kv"><span style="color:${F.RUNE[k].color}">${F.RUNE[k].label}</span><b>+${fmt(r.runes[k])}</b></div>`).join('')}
   ${r.levels.map(l => `<div class="kv"><span>${esc(S.roster[l.id].name)}</span><b>Lv ${l.from} → ${l.to}</b></div>`).join('')}</div>
   ${r.lost ? `<div class="card" style="border-color:#FF8A96"><b style="color:#FF8A96">Zaino pieno:</b> ${fmt(r.lost)} oggetti persi. Libera spazio, usa il forziere o attiva la vendita automatica.</div>` : ''}
   ${caps.length ? `<div class="card" style="border-color:#F2C14E"><b style="color:#F2C14E">Catture:</b> ${caps.map(esc).join(', ')}</div>` : ''}
   <button class="pb wide" data-act="close">Raccogli</button></div>`;
  $('#modal').hidden = false;
  r.events.filter(e => e.type === 'capture').forEach(e => capQueue.push(e.species));
}
function skipTime(hours) {
  const total = hours * 3600, chunk = 6 * 3600;
  let done = 0; const sum = { byRar: {}, skip: true, seconds: 0, gold: 0, kills: 0, items: 0, lost: 0, runes: { noncomune: 0, rara: 0, epica: 0, leggendaria: 0 }, levels: {}, events: [] };
  $('#modal').innerHTML = `<div class="mod" role="dialog" aria-modal="true"><h2>Avanti veloce</h2><p class="msub" id="skipst">Simulazione in corso…</p><div class="bar"><b id="skipbar" style="width:0%"></b></div></div>`;
  $('#modal').hidden = false;
  const run = () => {
    const sec = Math.min(chunk, total - done);
    const r = F.simulateOffline(S, sec, true);
    sum.seconds += r.seconds; sum.gold += r.gold; sum.kills += r.kills; sum.items += r.items; sum.lost += r.lost || 0; for (const k in (r.byRar || {})) sum.byRar[k] = (sum.byRar[k] || 0) + r.byRar[k];
    for (const k in r.runes) sum.runes[k] += r.runes[k];
    for (const l of r.levels) { if (!sum.levels[l.id]) sum.levels[l.id] = { id: l.id, from: l.from, to: l.to }; else sum.levels[l.id].to = l.to; }
    sum.events.push(...r.events);
    done += sec;
    $('#skipbar').style.width = (100 * done / total) + '%'; $('#skipst').textContent = `Simulazione in corso… ${Math.round(done / 3600)} h su ${hours} h`;
    if (done < total) setTimeout(run, 0);
    else {
      if (hours >= 8) F.ensureShop(S, Date.now(), true);
      F.checkAch(S); save(); B = F.startBattle(S); buildScene();
      sum.levels = Object.values(sum.levels); closeModal(); showOffline(sum); dirty = true;
    }
  };
  setTimeout(run, 30);
}

async function api(path, body) {

const ago = t => { const d = (Date.now() - new Date(t).getTime()) / 1000; return d < 60 ? 'ora' : d < 3600 ? Math.floor(d / 60) + ' min' : d < 86400 ? Math.floor(d / 3600) + ' h' : Math.floor(d / 86400) + ' g'; };
async function chatLoad() {

  }
  $('#modal').innerHTML = `<div class="mod chatmod" role="dialog" aria-modal="true" aria-label="Chat globale"><div class="eqhead"><h2 style="margin:0;font-size:18px">Community</h2><button class="ib" data-chat="close" aria-label="Chiudi" style="margin-left:auto">✕</button></div>
  <div class="tabs2"><button class="sb${chatTab === 'chat' ? ' on' : ''}" data-chat="tab" data-v="chat">Chat</button><button class="sb${chatTab === 'drops' ? ' on' : ''}" data-chat="tab" data-v="drops">Drop rari</button></div>
  ${chatErr ? `<div class="note" style="color:#FF8A96">${chatErr}</div>` : ''}${body}</div>`;

function chatShow() { chatOpen = true; $('#chatbtn').classList.remove('dot'); chatRender(); chatLoad(); clearInterval(chatTimer); chatTimer = setInterval(chatLoad, 6000); }
function chatClose() { chatOpen = false; clearInterval(chatTimer); closeModal(); }

// ---------- input ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; selItem = null; selRune = null; selShop = null; render(); $('#panel').scrollTop = 0; return; }
  const a = t.dataset.act, id = t.dataset.id, item = +t.dataset.item;
  const rebuild = () => { B = F.startBattle(S); buildScene(); };
  if (a === 'openm') openMember = openMember === id ? null : id;
  else if (a === 'up') F.moveMember(S, id, -1);
  else if (a === 'down') F.moveMember(S, id, 1);
  else if (a === 'add') { F.addToTeam(S, id); rebuild(); }
  else if (a === 'bench') { F.removeFromTeam(S, id); openMember = null; rebuild(); }
  else if (a === 'uneq') F.unequip(S, id, t.dataset.slot);
  else if (a === 'selit') { selItem = selItem === item ? null : item; selRune = null; }
  else if (a === 'lockit') { const on = F.toggleLock(S, item); toast(on ? 'Oggetto bloccato: non verrà mai venduto' : 'Oggetto sbloccato'); }
  else if (a === 'autoopen') { showAutoSell(); return; }
  else if (a === 'setkeep') { S.settings.minRarity = t.dataset.k; dirty = true; showAutoSell(); return; }
  else if (a === 'selrune') { selRune = selRune === t.dataset.k ? null : t.dataset.k; selItem = null; }
  else if (a === 'selshop') selShop = selShop === +t.dataset.i ? null : +t.dataset.i;
  else if (a === 'equipall') { const n = F.autoEquip(S); toast(n ? `Equipaggiati ${n} oggetti` : 'Nessun miglioramento disponibile'); }
  else if (a === 'sellrest') { const r = F.sellRest(S); toast(r.n ? `Venduti ${r.n} oggetti per ${cfmt(r.gold)} oro` : 'Niente da vendere'); }
  else if (a === 'eqto') { F.equipTo(S, item, id || $('#eqsel').value); selItem = null; eqSel = null; }
  else if (a === 'eqpick') { eqSel = eqSel === item ? null : item; }
  else if (a === 'sell') { F.sellItem(S, item); selItem = null; }
  else if (a === 'equip') { selSlot = null; eqSel = null; showEquip(id); return; }
  else if (a === 'selslot') { const v = id + ':' + t.dataset.slot; selSlot = selSlot === v ? null : v; }
  else if (a === 'slotup') { if (F.upgradeSlot(S, id, t.dataset.slot)) rebuild(); }
  else if (a === 'sellrune1') { F.sellRunes(S, t.dataset.k, 1); }
  else if (a === 'sellruneall') { const g = F.sellRunes(S, t.dataset.k, S.runes[t.dataset.k]); toast(`+${g} Astri`); }
  else if (a === 'raise') { const it = S.inventory.find(x => x.id === item); if (it && F.raiseRarity(S, it)) { toast(`Rarità migliorata: ${esc(F.itemName(it))}`, F.ITEM_RARITY.find(x => x.key === it.rarity).color); if (S.settings.autoEquip) F.autoEquip(S); } }
  else if (a === 'buy') { if (F.buyShop(S, +t.dataset.i)) toast('Acquistato: lo trovi nello zaino'); }
  else if (a === 'reroll') { selShop = null; if (F.rerollShop(S)) toast('Il mercante ha cambiato la merce', '#F49AC1'); }
  else if (a === 'skip') { skipTime(+t.dataset.h); return; }
  else if (a === 'sellbelow') { const r = F.sellBelow(S); toast(r.n ? `Venduti ${r.n} oggetti per ${cfmt(r.gold)} oro` : 'Niente sotto la soglia'); }
  else if (a === 'claim') { const r = F.claimMission(S, id); if (r) toast(`Missione completata: +${r.astri} Astri, +1 ${F.RUNE[r.rune[0]].label.toLowerCase()}`, '#F2C14E'); }
  else if (a === 'buyhero') { if (F.buyHero(S, id)) { toast(F.SPECIES[id].name + ' si unisce alla squadra! (versione di prova)', '#F2C14E'); rebuild(); } }

  else if (a === 'fromchest') { F.fromChest(S, +t.dataset.item); selItem = null; }
  else if (a === 'givegold') { S.gold += +t.dataset.v; toast(`+${cfmt(+t.dataset.v)} oro`, '#F2C14E'); }
  else if (a === 'giveastri') { S.astri += +t.dataset.v; toast(`+${fmt(+t.dataset.v)} Astri`, '#F49AC1'); }
  else if (a === 'selstar') selStar = t.dataset.k;
  else if (a === 'buyrune') { if (F.buyRune(S, t.dataset.k)) toast(`+1 ${F.RUNE[t.dataset.k].label.toLowerCase()}`, F.RUNE[t.dataset.k].color); }
  else if (a === 'daily') { const g = F.claimDaily(S); if (g) toast(`+${g} ${icon('gem', '#F49AC1', 14)} Astri: regalo del giorno`, '#F49AC1'); }
  else if (a === 'pass') { F.activatePass(S); toast('Pass Astrale attivo per 30 giorni (versione di prova)', '#F2C14E'); }
  else if (a === 'zone') { if (F.setZone(S, +t.dataset.z)) { rebuild(); banner('ZONA ' + S.zone); } }
  else if (a === 'tree') { F.buyTree(S, t.dataset.k); }
  else if (a === 'treereset') { if (confirmTree > Date.now()) { const b = F.resetTree(S); confirmTree = 0; toast(`Recuperati ${cfmt(b)} oro`); rebuild(); } else confirmTree = Date.now() + 3000; }
  else if (a === 'reset') { if (confirmReset > Date.now()) { S = F.newState(); save(); rebuild(); confirmReset = 0; toast('Nuova partita'); } else confirmReset = Date.now() + 3000; }
  else if (a === 'capadd') { F.addToTeam(S, id); rebuild(); closeModal(); }
  else if (a === 'share') { const m = S.roster[id], d = F.SPECIES[m.species]; const txt = `Ho catturato ${m.name} (${F.RARITY[d.rarity].label}, ${d.cls}) in Frontiera Arcana dopo ${fmt(m.waitKills)} incontri!`; try { navigator.clipboard.writeText(txt).then(() => { t.textContent = 'Copiato!'; }, () => { t.textContent = 'Copia non riuscita'; }); } catch (err) { t.textContent = 'Copia non riuscita'; } return; }

  if (a === 'tree' || a === 'treereset') { /* stelle cambiano le statistiche */ B.party.forEach(() => {}); }

});
document.addEventListener('change', e => {
  const t = e.target; const a = t.dataset && t.dataset.act; if (!a) return;

  if (a === 'autoeq') { S.settings.autoEquip = t.checked; if (t.checked) F.autoEquip(S); }

document.addEventListener('submit', e => {

  const f = e.target.closest('form.rename'); if (!f) return; e.preventDefault();

});

// ---------- ciclo ----------
let last = performance.now(), saveAt = 0, achAt = 0, renderAt = 0;
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000); last = now;
  S.stats.played += dt;
  const speed = S.settings.test ? 5 : 1; let left = dt * speed;
  const ev = [];
  while (left > 0) { const d = Math.min(0.05, left); F.step(S, B, d, ev); left -= d; }
  handle(ev); updateScene(); hud();
  if (now - achAt > 1500) { achAt = now; for (const a of F.checkAch(S)) { toast(`Achievement: <b>${esc(a.name)}</b> · +${a.astri} Astri`, '#F2C14E'); dirty = true; } }
  if ($('#modal').hidden && capQueue.length) showCapture(capQueue.shift());
  if (dirty && now - renderAt > 700 && !document.activeElement.matches('input,select')) { renderAt = now; render(); }
  if (now - saveAt > 10000) { saveAt = now; if (F.ensureShop(S, Date.now())) toast('Il mercante ha nuovi oggetti', '#F49AC1'); save(); }
  requestAnimationFrame(frame);
}
function catchUp() {
  const away = (Date.now() - (S.lastSeen || Date.now())) / 1000;
  if (away > 30) { const r = F.simulateOffline(S, away); F.checkAch(S); save(); showOffline(r); }
  B = F.startBattle(S); buildScene();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) save();
  else { catchUp(); last = performance.now(); dirty = true; }
});
window.addEventListener('pagehide', save);

const had = load();
F.ensureShop(S, Date.now());
if (!S.settings) S.settings = { autoEquip: true, test: false };
if (had) catchUp(); else { B = F.startBattle(S); buildScene(); toast('Benvenuto! La squadra combatte da sola: guarda, potenzia, cattura.', '#F2C14E'); }
banner('BATTAGLIA ' + S.battle);
setScroll(); render(); hud();
requestAnimationFrame(t => { last = t; frame(t); });
})();
